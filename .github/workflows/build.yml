name: 编译 yuni char APK
on:
  push:
    paths: ['source.zip', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 解压并编译
        run: |
          set -e
          test -f source.zip
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            BIN=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
            [ -n "$BIN" ] && export PATH="$(dirname "$BIN"):$ANDROID_HOME/platform-tools:$PATH"
          fi
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          rm -rf project && mkdir project
          unzip -q source.zip -d project
          ROOT=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$ROOT"
          gradle assembleDebug --no-daemon --stacktrace
          echo "APK=$PWD/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: yuni-char-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
