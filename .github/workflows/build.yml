name: 编译 yuni char APK
on:
  push:
    paths: ['source.zip', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          sudo mkdir -p "$ANDROID_HOME/licenses" || true
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f4867471eab7cf98ce9a2f2d0d8db8d0d7d\n' | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" >/dev/null || true
          printf '\n84831b9409646a918e30573bab4c9c91359e58\n' | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" >/dev/null || true
          ls "$ANDROID_HOME/platforms" || true
      - name: 解压并编译
        run: |
          rm -rf project && mkdir project
          unzip -q source.zip -d project
          ROOT=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$ROOT"
          echo "android.builder.sdkDownload=true" >> gradle.properties
          gradle assembleDebug --no-daemon --stacktrace
          echo "APK=$PWD/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: yuni-char-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
